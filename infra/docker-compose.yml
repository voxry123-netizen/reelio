version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reelio
      POSTGRES_PASSWORD: reelio
      POSTGRES_DB: reelio
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelio -d reelio"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh","-c"]
    command: >
      "mc alias set local ${S3_ENDPOINT:-http://minio:9000} ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
       mc mb -p local/${S3_BUCKET:-reelio} || true &&
       mc anonymous set download local/${S3_BUCKET:-reelio} || true &&
       echo 'MinIO bucket ready.'"

  ai:
    build:
      context: ../apps/ai
    ports: ["8000:8000"]

  api:
    build:
      context: ../apps/api
    env_file: [../.env]
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_started
      ai:
        condition: service_started
    command: ["pnpm","start:api:docker"]
    environment:
      DOCKER: "1"

  worker:
    build:
      context: ../apps/api
    env_file: [../.env]
    depends_on: [api]
    command: ["pnpm","start:worker"]

  web:
    build:
      context: ../apps/web
    env_file: [../.env]
    ports: ["3000:3000"]
    depends_on: [api]
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

volumes:
  pgdata:
  miniodata:
